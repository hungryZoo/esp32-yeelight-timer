; Yeelight Candela BLE 타이머 (ESP32-C3 0.42" OLED 보드)
;   USB 업로드: pio run -t upload
;   OTA 업로드: pio run -e ota -t upload   (비밀번호는 include/secrets.h OTA_PASSWORD)

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; OTA 2슬롯 + 앱 1.9MB (WiFi + NimBLE + WebServer 용량 확보)
board_build.partitions = min_spiffs.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino
    olikraus/U8g2

monitor_speed = 115200
monitor_filters = time
upload_speed = 921600

[env:ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = candela-timer.local
extra_scripts = tools/ota_auth.py
